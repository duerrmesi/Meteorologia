<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetterstation — Live-Daten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2430;
    --bg-gradient: radial-gradient(ellipse at top, #223046 0%, #1B2430 60%);
    --panel: #232F3E;
    --panel-border: #34455A;
    --text: #E8EDF2;
    --text-dim: #8FA0B3;
    --accent-amber: #E8A33D;
    --accent-teal: #4FA8A0;
    --accent-red: #D6685A;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-gradient);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  a { color: inherit; }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }

  .station-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(24px, 4vw, 32px);
    letter-spacing: 0.01em;
    margin: 0;
  }

  .station-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 0.03em;
  }

  .live-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-teal);
    box-shadow: 0 0 0 0 rgba(79, 168, 160, 0.6);
    animation: pulse 2.2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79, 168, 160, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(79, 168, 160, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 168, 160, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }

  /* ---------- Hero ---------- */
  .hero {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  @media (max-width: 680px) {
    .hero { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 24px;
  }

  .instrument-label {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 12px;
  }

  .temp-value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(56px, 9vw, 84px);
    line-height: 1;
    color: var(--accent-amber);
  }

  .temp-value .unit {
    font-size: 0.4em;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 4px;
  }

  .temp-meta {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  .temp-meta span b {
    color: var(--text);
    font-weight: 500;
  }

  /* ---------- Wind compass (signature element) ---------- */
  .compass-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .compass {
    width: 160px;
    height: 160px;
    position: relative;
  }

  .compass svg { width: 100%; height: 100%; }

  .compass-needle {
    transform-origin: 80px 80px;
    transform: rotate(var(--wind-deg, 0deg));
    transition: transform 1.2s cubic-bezier(0.34, 1.2, 0.4, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    .compass-needle { transition: none; }
  }

  .wind-readout {
    margin-top: 14px;
    text-align: center;
    font-family: var(--font-mono);
  }

  .wind-speed {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-teal);
  }

  .wind-dir-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* ---------- Instrument grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  @media (max-width: 780px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }

  .instrument-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 18px;
  }

  .instrument-value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
  }

  .instrument-value .unit {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 3px;
  }

  .instrument-card.uv-high .instrument-value { color: var(--accent-red); }
  .instrument-card.rain-active .instrument-value { color: var(--accent-teal); }

  .instrument-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 32px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  /* ---------- Focus visibility ---------- */
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent-amber);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <p class="station-name">Wetterstation</p>
      <p class="station-sub">ESP32 · Eigenbau-Sensorik</p>
    </div>
    <div class="live-status">
      <span class="live-dot"></span>
      <span id="last-update">Letzte Aktualisierung: —</span>
    </div>
  </header>

  <section class="hero">
    <div class="panel">
      <p class="instrument-label">Temperatur</p>
      <div class="temp-value" id="temp-value">—<span class="unit">°C</span></div>
      <div class="temp-meta">
        <span>Gefühlt <b id="temp-feels">—</b></span>
        <span>Trend <b id="temp-trend">—</b></span>
      </div>
    </div>

    <div class="panel compass-wrap">
      <p class="instrument-label" style="align-self: flex-start;">Wind</p>
      <div class="compass">
        <svg viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="76" fill="none" stroke="#34455A" stroke-width="1.5"/>
          <text x="80" y="18" fill="#8FA0B3" font-family="JetBrains Mono" font-size="11" text-anchor="middle">N</text>
          <text x="146" y="84" fill="#8FA0B3" font-family="JetBrains Mono" font-size="11" text-anchor="middle">O</text>
          <text x="80" y="150" fill="#8FA0B3" font-family="JetBrains Mono" font-size="11" text-anchor="middle">S</text>
          <text x="14" y="84" fill="#8FA0B3" font-family="JetBrains Mono" font-size="11" text-anchor="middle">W</text>
          <g class="compass-needle" id="compass-needle">
            <polygon points="80,24 88,80 80,68 72,80" fill="#E8A33D"/>
            <polygon points="80,136 88,80 80,92 72,80" fill="#34455A"/>
            <circle cx="80" cy="80" r="5" fill="#E8EDF2"/>
          </g>
        </svg>
      </div>
      <div class="wind-readout">
        <div class="wind-speed" id="wind-speed">— km/h</div>
        <div class="wind-dir-label" id="wind-dir-label">—</div>
      </div>
    </div>
  </section>

  <section class="grid">
    <div class="instrument-card">
      <p class="instrument-label">Luftdruck</p>
      <div class="instrument-value" id="pressure-value">—<span class="unit">hPa</span></div>
      <p class="instrument-note" id="pressure-note">—</p>
    </div>

    <div class="instrument-card">
      <p class="instrument-label">Luftfeuchtigkeit</p>
      <div class="instrument-value" id="humidity-value">—<span class="unit">%</span></div>
      <p class="instrument-note" id="humidity-note">—</p>
    </div>

    <div class="instrument-card" id="uv-card">
      <p class="instrument-label">UV-Index</p>
      <div class="instrument-value" id="uv-value">—</div>
      <p class="instrument-note" id="uv-note">—</p>
    </div>

    <div class="instrument-card" id="rain-card">
      <p class="instrument-label">Niederschlag</p>
      <div class="instrument-value" id="rain-value">—<span class="unit">mm</span></div>
      <p class="instrument-note" id="rain-note">letzte 24 h</p>
    </div>
  </section>

  <footer>
    Daten vom ESP32 · aktualisiert automatisch
  </footer>

</div>

<script>
  // ---------------------------------------------------------------
 async function loadData() {
  const res = await fetch("https://meteorologia-377e2-default-rtdb.europe-west1.firebasedatabase.app/");
  const data = await res.json();
  render(data);
}


  // ---------------------------------------------------------------



  function windDirectionText(deg) {
    const dirs = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
    return dirs[Math.round(deg / 45) % 8];
  }

  function render(data) {
    document.getElementById("temp-value").innerHTML =
      data.temperature.toFixed(1) + '<span class="unit">°C</span>';
    document.getElementById("temp-feels").textContent = data.feelsLike.toFixed(1) + " °C";
    document.getElementById("temp-trend").textContent = data.trend;

    document.getElementById("pressure-value").innerHTML =
      data.pressure + '<span class="unit">hPa</span>';
    document.getElementById("pressure-note").textContent = "Trend: " + data.pressureTrend;

    document.getElementById("humidity-value").innerHTML =
      data.humidity + '<span class="unit">%</span>';
    document.getElementById("humidity-note").textContent =
      data.humidity > 70 ? "hoch" : data.humidity < 30 ? "niedrig" : "normal";

    document.getElementById("wind-speed").textContent = data.windSpeed + " km/h";
    document.getElementById("wind-dir-label").textContent =
      data.windDirectionLabel || windDirectionText(data.windDirectionDeg);
    document.getElementById("compass-needle").style.setProperty("--wind-deg", data.windDirectionDeg + "deg");
    document.getElementById("compass-needle").style.transform = "rotate(" + data.windDirectionDeg + "deg)";

    const uvCard = document.getElementById("uv-card");
    document.getElementById("uv-value").textContent = data.uvIndex;
    document.getElementById("uv-note").textContent =
      data.uvIndex >= 6 ? "hoch — Schutz empfohlen" : data.uvIndex >= 3 ? "mäßig" : "niedrig";
    uvCard.classList.toggle("uv-high", data.uvIndex >= 6);

    const rainCard = document.getElementById("rain-card");
    document.getElementById("rain-value").innerHTML =
      data.rainLast24h.toFixed(1) + '<span class="unit">mm</span>';
    rainCard.classList.toggle("rain-active", data.rainLast24h > 0);

    document.getElementById("last-update").textContent =
      "Letzte Aktualisierung: " + new Date().toLocaleTimeString("de-DE");
  }

  render(mockData);

  loadData();
setInterval(loadData, 60000); // alle 60 Sekunden neu laden
</script>

</body>
</html>
