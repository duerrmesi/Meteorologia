<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter Analytics Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141820;
            --card-shadow-dark: #07090d;
            --card-shadow-light: #212733;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --accent-orange: linear-gradient(145deg, #ff9b26, #e65c00);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1400px;
            width: 100%;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
        }

        /* Neumorphism Cards */
        .neu-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 
                8px 8px 16px var(--card-shadow-dark), 
                -8px -8px 16px var(--card-shadow-light);
            padding: 20px;
        }

        /* Linke Spalte */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .orange-card {
            background: var(--accent-orange);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.4), 
                -5px -5px 15px rgba(255, 155, 38, 0.2),
                inset 2px 2px 5px rgba(255,255,255,0.3);
            color: white;
            position: relative;
        }

        .orange-card .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .orange-card .temp-large {
            font-size: 60px;
            font-weight: 700;
            line-height: 1;
            margin: 20px 0 15px;
        }

        .calculated-pills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .pill {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        .pill span {
            display: block;
            font-size: 10px;
            opacity: 0.8;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .metric-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 10px;
            text-align: center;
            position: relative;
        }

        .metric-card i {
            font-size: 22px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .metric-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 600;
        }

        .offline-tag {
            font-size: 9px;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* Rechte Spalte */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Tage Übersicht */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        .day-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border-radius: 15px;
            background: var(--card-bg);
            box-shadow: 4px 4px 8px var(--card-shadow-dark), -4px -4px 8px var(--card-shadow-light);
            text-align: center;
        }

        .day-card .day-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .day-card .day-temp {
            font-size: 15px;
            font-weight: 700;
            color: #ff9b26;
        }

        /* Multi-Chart Container */
        .chart-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chart-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chart-tabs, .timeframe-tabs {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            align-items: center;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 2px 2px 5px var(--card-shadow-dark);
        }

        .timeframe-btn.active {
            background: #ff9b26;
            color: white;
        }

        .date-picker {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            color-scheme: dark;
            outline: none;
            cursor: pointer;
        }

        .date-picker:focus, .date-picker.active {
            color: var(--text-main);
            border-color: #ff9b26;
        }

        .chart-canvas-container {
            height: 300px;
            width: 100%;
            position: relative;
        }

        /* Bottom Row */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .history-list-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .history-grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .min-max-card {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .min-max-card .date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .min-max-values {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
        }

        .min-val { color: var(--accent-blue); }
        .max-val { color: #ff9b26; }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .days-grid { grid-template-columns: repeat(3, 1fr); }
            .history-grid-container { grid-template-columns: repeat(2, 1fr); }
            .chart-controls { flex-direction: column; align-items: stretch; }
            .timeframe-tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1 class="dashboard-header">Wetter Analytics Dashboard</h1>
        
        <div class="dashboard-grid">
            
            <!-- Linke Spalte -->
            <div class="left-column">
                
                <div class="orange-card">
                    <div class="header-row">
                        <div><i class="fas fa-satellite-dish"></i> Wetterstation</div>
                        <div id="last-update">Update: --:--</div>
                    </div>
                    <div class="temp-large" id="temp-main">-- °C</div>
                    
                    <div class="calculated-pills">
                        <div class="pill">
                            <span>Taupunkt</span>
                            <strong id="dew-point">-- °C</strong>
                        </div>
                        <div class="pill">
                            <span>Druck-Trend (3h)</span>
                            <strong id="pressure-trend">--</strong>
                        </div>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="neu-card metric-card">
                        <i class="fas fa-tint"></i>
                        <div class="metric-title">Luftfeuchtigkeit</div>
                        <div class="metric-value" id="hum-val">-- %</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-tachometer-alt"></i>
                        <div class="metric-title">Luftdruck</div>
                        <div class="metric-value" id="press-val">-- hPa</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="far fa-compass"></i>
                        <div class="metric-title">Windrichtung</div>
                        <div class="metric-value" id="wind-dir-val">--</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-wind"></i>
                        <div class="metric-title">Windgeschw.</div>
                        <div class="metric-value" id="wind-speed-val">--</div>
                        <div class="offline-tag" id="wind-speed-tag" style="display:none;">Offline</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-sun"></i>
                        <div class="metric-title">UV Index</div>
                        <div class="metric-value" id="uv-val">--</div>
                        <div class="offline-tag" id="uv-tag" style="display:none;">Offline</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-cloud-rain"></i>
                        <div class="metric-title">Niederschlag</div>
                        <div class="metric-value" id="rain-val">--</div>
                        <div class="offline-tag" id="rain-tag" style="display:none;">Offline</div>
                    </div>
                </div>
            </div>

            <!-- Rechte Spalte -->
            <div class="right-column">
                
                <div class="days-grid" id="days-history-grid">
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                </div>

                <!-- Interaktiver Multi-Chart Bereich -->
                <div class="neu-card chart-section">
                    <div class="chart-controls">
                        <!-- Sensor Tabs -->
                        <div class="chart-tabs">
                            <button class="tab-btn active" onclick="switchMetric('temperature')">Temp</button>
                            <button class="tab-btn" onclick="switchMetric('humidity')">Feuchte</button>
                            <button class="tab-btn" onclick="switchMetric('pressure')">Druck</button>
                            <button class="tab-btn" onclick="switchMetric('windDirectionDeg')">Wind</button>
                            <button class="tab-btn" onclick="switchMetric('uvIndex')">UV</button>
                            <button class="tab-btn" onclick="switchMetric('rainLast24h')">Regen</button>
                        </div>
                        <!-- Timeframe Switcher & Datepicker -->
                        <div class="timeframe-tabs">
                            <button class="tab-btn timeframe-btn" onclick="switchTimeframe('1h', this)">1 Std</button>
                            <button class="tab-btn timeframe-btn active" onclick="switchTimeframe('24h', this)">24 Std</button>
                            <button class="tab-btn timeframe-btn" onclick="switchTimeframe('7d', this)">7 Tage</button>
                            <button class="tab-btn timeframe-btn" onclick="switchTimeframe('all', this)">Allzeit</button>
                            <input type="date" id="date-picker" class="date-picker" onchange="switchTimeframe('date', this)">
                        </div>
                    </div>

                    <div class="chart-canvas-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <div class="neu-card">
                    <div class="history-list-title">
                        <span>Gemessene Tages-Extreme (Min / Max)</span>
                        <i class="fas fa-temperature-half" style="color: var(--text-muted)"></i>
                    </div>
                    <div class="history-grid-container" id="min-max-grid">
                        <div class="min-max-card"><div class="date">Berechne...</div></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ------------------ CONFIG & CONSTANTS ------------------
        const FIREBASE_BASE = "https://meteorologia-377e2-default-rtdb.europe-west1.firebasedatabase.app";
        const FIREBASE_LATEST = `${FIREBASE_BASE}/messwerte.json`;
        const FIREBASE_7DAYS = `${FIREBASE_BASE}/historie.json?orderBy=%22timestamp%22&limitToLast=10080`;

        Chart.defaults.color = '#8b95a5';
        Chart.defaults.borderColor = '#212733';
        let mainChart = null;

        // Zustände
        let rawHistoryData = [];      // Standard 7-Tage Daten für Dashboard-Karten
        let currentChartData = [];    // Daten, die gerade im Diagramm angezeigt werden
        let currentMetric = 'temperature';
        let currentTimeframe = '24h';

        const metricConfigs = {
            temperature: { label: 'Temperatur (°C)', color: '#ff9b26', bg: 'rgba(255, 155, 38, 0.1)' },
            humidity: { label: 'Luftfeuchtigkeit (%)', color: '#3b82f6', bg: 'rgba(59, 130, 246, 0.1)' },
            pressure: { label: 'Luftdruck (hPa)', color: '#10b981', bg: 'rgba(16, 185, 129, 0.1)' },
            windDirectionDeg: { label: 'Windrichtung', color: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.1)' },
            uvIndex: { label: 'UV-Index', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.1)' },
            rainLast24h: { label: 'Niederschlag (mm)', color: '#06b6d4', bg: 'rgba(6, 182, 212, 0.1)' }
        };

        // ------------------ MATHEMATISCHE BERECHNUNGEN ------------------
        function calculateDewPoint(temp, humidity) {
            if (temp == null || humidity == null) return "--";
            const a = 17.27, b = 237.7;
            const alpha = ((a * temp) / (b + temp)) + Math.log(humidity / 100.0);
            return ((b * alpha) / (a - alpha)).toFixed(1) + " °C";
        }

        function calculatePressureTrend(values) {
            if (!values || values.length < 2) return "--";
            const latest = values[values.length - 1];
            const targetTime = latest.timestamp - (3 * 60 * 60 * 1000);
            const pastEntry = values.find(v => v.timestamp >= targetTime) || values[0];
            
            if (!pastEntry || pastEntry.pressure == null || latest.pressure == null) return "--";
            const diff = latest.pressure - pastEntry.pressure;
            let arrow = diff > 1.5 ? "⇈" : diff > 0.5 ? "↗" : diff < -1.5 ? "⇊" : diff < -0.5 ? "↘" : "➔";
            return `${arrow} ${diff > 0 ? '+' : ''}${diff.toFixed(1)} hPa`;
        }

        // Neue Himmelsrichtungen-Logik
        function getWindDirectionText(deg) {
            if (deg == null) return "--";
            const dirs = ["N", "NO", "O", "SO", "S", "SW", "W", "NW", "N"];
            // Umrechnung in 8 Sektoren (45° Schritte)
            return dirs[Math.round((deg % 360) / 45)];
        }

        // ------------------ LIVE DATEN LADEN ------------------
        async function loadLive() {
            try {
                const res = await fetch(FIREBASE_LATEST);
                const data = await res.json();
                if (!data) return;

                document.getElementById('temp-main').innerText = data.temperature ? data.temperature.toFixed(2) + " °C" : "-- °C";
                document.getElementById('hum-val').innerText = data.humidity ? data.humidity.toFixed(0) + " %" : "-- %";
                document.getElementById('press-val').innerText = data.pressure ? data.pressure.toFixed(0) + " hPa" : "-- hPa";
                document.getElementById('wind-dir-val').innerText = getWindDirectionText(data.windDirectionDeg);
                document.getElementById('dew-point').innerText = calculateDewPoint(data.temperature, data.humidity);

                handlePlaceholderSensor('wind-speed-val', 'wind-speed-tag', data.windSpeed, " km/h");
                handlePlaceholderSensor('uv-val', 'uv-tag', data.uvIndex, "");
                handlePlaceholderSensor('rain-val', 'rain-tag', data.rainLast24h, " mm");

                const date = new Date(data.timestamp || Date.now());
                document.getElementById('last-update').innerText = "Update: " + date.toLocaleTimeString("de-DE", {hour: '2-digit', minute:'2-digit'});
            } catch (e) { console.error("Fehler bei Live-Daten:", e); }
        }

        function handlePlaceholderSensor(valId, tagId, value, unit) {
            const valElem = document.getElementById(valId);
            const tagElem = document.getElementById(tagId);
            if (value === -1 || value == null) {
                valElem.innerText = "--";
                tagElem.style.display = "inline-block";
            } else {
                valElem.innerText = value + unit;
                tagElem.style.display = "none";
            }
        }

        // ------------------ HISTORIE & DIAGRAMM STEUERUNG ------------------
        async function initDashboard() {
            try {
                // Lade zuerst die Standard 7-Tage für das UI
                const res = await fetch(FIREBASE_7DAYS);
                const data = await res.json();
                if (data) {
                    rawHistoryData = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
                    currentChartData = [...rawHistoryData];
                    
                    document.getElementById('pressure-trend').innerText = calculatePressureTrend(rawHistoryData);
                    renderDaysOverview();
                    renderMinMaxGrid();
                    updateChart();
                }
            } catch (e) { console.error("Fehler Init Dashboard:", e); }
        }

        // Zeiträume und Datums-Suche laden
        async function switchTimeframe(tf, btnElement) {
            currentTimeframe = tf;
            
            // Buttons visuell updaten
            document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('date-picker').classList.remove('active');
            
            if (tf === 'date') {
                btnElement.classList.add('active');
            } else {
                if(btnElement) btnElement.classList.add('active');
                document.getElementById('date-picker').value = ""; // Reset Kalender
            }

            // Ladeanimation ins Diagramm schreiben
            if (mainChart) {
                mainChart.data.datasets[0].data = [];
                mainChart.update();
            }

            if (tf === '1h' || tf === '24h' || tf === '7d') {
                currentChartData = [...rawHistoryData];
                updateChart();
            } 
            else if (tf === 'all') {
                // Hole ALLES aus der Datenbank (Vorsicht bei extrem großen Datenbanken, downsampling passiert unten)
                try {
                    const res = await fetch(`${FIREBASE_BASE}/historie.json?orderBy=%22timestamp%22`);
                    const data = await res.json();
                    currentChartData = data ? Object.values(data).sort((a, b) => a.timestamp - b.timestamp) : [];
                    updateChart();
                } catch(e) { console.error("Fehler Allzeit:", e); }
            } 
            else if (tf === 'date') {
                // Hole gezielt nur den gewählten Tag
                const selectedDate = document.getElementById('date-picker').value;
                if (!selectedDate) return;
                
                const start = new Date(selectedDate);
                start.setHours(0,0,0,0);
                const end = new Date(selectedDate);
                end.setHours(23,59,59,999);

                try {
                    const res = await fetch(`${FIREBASE_BASE}/historie.json?orderBy=%22timestamp%22&startAt=${start.getTime()}&endAt=${end.getTime()}`);
                    const data = await res.json();
                    currentChartData = data ? Object.values(data).sort((a, b) => a.timestamp - b.timestamp) : [];
                    updateChart();
                } catch(e) { console.error("Fehler bei Datumssuche:", e); }
            }
        }

        function switchMetric(metric) {
            currentMetric = metric;
            document.querySelectorAll('.chart-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateChart();
        }

        // Intelligentes Downsampling für Diagramme
        function processChartData() {
            if (!currentChartData || !currentChartData.length) return { labels: [], values: [] };
            let filtered = currentChartData;
            const now = Date.now();

            if (currentTimeframe === '1h') filtered = currentChartData.filter(d => d.timestamp >= now - 3600000);
            if (currentTimeframe === '24h') filtered = currentChartData.filter(d => d.timestamp >= now - 86400000);

            const groups = {};
            filtered.forEach(d => {
                const date = new Date(d.timestamp);
                let key;

                if (currentTimeframe === '1h') {
                    // Minutengenau
                    key = date.toLocaleTimeString("de-DE", {hour: '2-digit', minute:'2-digit'});
                } else if (currentTimeframe === '24h' || currentTimeframe === 'date') {
                    // 10-Minuten Durchschnitte (Schont den Browser und macht den Tooltip angenehmer)
                    const m = Math.floor(date.getMinutes() / 10) * 10;
                    date.setMinutes(m, 0, 0);
                    key = date.toLocaleTimeString("de-DE", {hour: '2-digit', minute:'2-digit'});
                } else if (currentTimeframe === '7d') {
                    // Stundendurchschnitte
                    date.setMinutes(0, 0, 0);
                    key = date.toLocaleString("de-DE", { day: '2-digit', month: '2-digit', hour: '2-digit' }) + "h";
                } else if (currentTimeframe === 'all') {
                    // Tagesdurchschnitte
                    key = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
                }

                if (!groups[key]) groups[key] = [];
                if (d[currentMetric] != null && d[currentMetric] !== -1) {
                    groups[key].push(d[currentMetric]);
                }
            });

            const labels = [];
            const values = [];

            Object.keys(groups).forEach(key => {
                labels.push(key);
                const arr = groups[key];
                if (arr.length > 0) {
                    if (currentMetric === 'windDirectionDeg') {
                        // Bei Gradzahlen nehmen wir den mittleren gemessenen Wert der Zeitspanne
                        values.push(arr[Math.floor(arr.length / 2)]);
                    } else {
                        values.push(arr.reduce((a, b) => a + b, 0) / arr.length); // Normaler Durchschnitt
                    }
                } else {
                    values.push(null);
                }
            });

            return { labels, values };
        }

        // ------------------ CHART RENDERING ------------------
        function updateChart() {
            const { labels, values } = processChartData();
            const config = metricConfigs[currentMetric];
            const ctx = document.getElementById('mainChart').getContext('2d');

            if (mainChart) mainChart.destroy();

            // Achsen-Einstellungen speziell für Windrichtung
            let yAxisConfig = { grid: { color: '#212733' } };
            if (currentMetric === 'windDirectionDeg') {
                yAxisConfig = {
                    ...yAxisConfig,
                    min: 0,
                    max: 360,
                    ticks: {
                        stepSize: 45,
                        callback: function(value) { return getWindDirectionText(value); }
                    }
                };
            }

            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: config.label,
                        data: values,
                        borderColor: config.color,
                        backgroundColor: config.bg,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: (currentTimeframe === '1h' || currentTimeframe === 'all') ? 3 : 0,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // MAGNET-EFFEKT: Aktiviert den Hover über die gesamte vertikale Linie
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: { 
                        legend: { display: true, position: 'top', align: 'end' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let val = context.parsed.y;
                                    // Custom Tooltip für Himmelsrichtungen
                                    if (currentMetric === 'windDirectionDeg') {
                                        return `${config.label}: ${getWindDirectionText(val)} (${val}°)`;
                                    }
                                    return `${config.label}: ${val.toFixed(1)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
                        y: yAxisConfig
                    }
                }
            });
        }

        // ------------------ TAGES-STATISTIKEN (KARTEN) ------------------
        function renderDaysOverview() {
            const daily = {};
            rawHistoryData.forEach(v => {
                const d = new Date(v.timestamp);
                const dayKey = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                if (!daily[dayKey]) daily[dayKey] = { temps: [], ts: v.timestamp };
                if (v.temperature != null) daily[dayKey].temps.push(v.temperature);
            });
            const days = Object.keys(daily).map(k => ({ label: k, temps: daily[k].temps, ts: daily[k].ts })).sort((a,b) => a.ts - b.ts).slice(-6);
            
            document.getElementById('days-history-grid').innerHTML = days.map(d => 
                `<div class="day-card"><div class="day-name">${d.label}</div><div class="day-temp">Ø ${(d.temps.reduce((a,b)=>a+b,0)/d.temps.length).toFixed(1)}°</div></div>`
            ).join('');
        }

        function renderMinMaxGrid() {
            const daily = {};
            rawHistoryData.forEach(v => {
                const d = new Date(v.timestamp);
                const dayKey = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                if (!daily[dayKey]) daily[dayKey] = { temps: [], ts: v.timestamp };
                if (v.temperature != null) daily[dayKey].temps.push(v.temperature);
            });
            const days = Object.keys(daily).map(k => ({ label: k, temps: daily[k].temps, ts: daily[k].ts })).sort((a,b) => b.ts - a.ts).slice(0, 4);

            document.getElementById('min-max-grid').innerHTML = days.map(d => 
                `<div class="min-max-card"><div class="date">${d.label}</div><div class="min-max-values"><span class="min-val">${Math.min(...d.temps).toFixed(1)} °C</span><span class="max-val">${Math.max(...d.temps).toFixed(1)} °C</span></div></div>`
            ).join('');
        }

        // Start
        loadLive();
        initDashboard();
        setInterval(loadLive, 60000); 
    </script>
</body>
</html>
