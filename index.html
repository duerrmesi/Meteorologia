<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter Analytics Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141820;
            --card-shadow-dark: #07090d;
            --card-shadow-light: #212733;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --accent-orange: linear-gradient(145deg, #ff9b26, #e65c00);
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1400px;
            width: 100%;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        /* --- Neumorphic Card Base --- */
        .neu-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 
                8px 8px 16px var(--card-shadow-dark), 
                -8px -8px 16px var(--card-shadow-light);
            padding: 20px;
        }

        /* --- Left Column --- */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .orange-card {
            background: var(--accent-orange);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.4), 
                -5px -5px 15px rgba(255, 155, 38, 0.2),
                inset 2px 2px 5px rgba(255,255,255,0.3);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .orange-card .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .orange-card .location {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .orange-card .temp-large {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            margin: 20px 0 25px;
        }

        .location-pills {
            display: flex;
            gap: 15px;
        }

        .pill {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        /* 2x3 Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .metric-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            text-align: center;
            border-radius: 15px;
        }

        .metric-card i {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .metric-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 600;
        }

        /* --- Right Column --- */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Top Days Grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        .day-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 15px;
            background: var(--card-bg);
            box-shadow: 5px 5px 10px var(--card-shadow-dark), -5px -5px 10px var(--card-shadow-light);
            transition: all 0.3s ease;
        }
        
        .day-card:hover {
            box-shadow: inset 5px 5px 10px var(--card-shadow-dark), inset -5px -5px 10px var(--card-shadow-light);
        }

        .day-card .day-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .day-card .day-temp {
            font-size: 18px;
            font-weight: 700;
            color: #ff9b26;
        }

        /* Charts */
        .chart-container {
            height: 250px;
            width: 100%;
            padding: 20px;
        }

        .bottom-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        /* Lists */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }
        
        .history-list-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid var(--card-shadow-light);
        }
        
        .list-item:last-child {
            border-bottom: none;
        }

        .min-max-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: monospace;
            font-size: 13px;
        }

        .min-val { color: var(--accent-blue); }
        .max-val { color: #ff9b26; }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .days-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .bottom-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1 class="dashboard-header">Wetter Analytics Dashboard</h1>
        
        <div class="dashboard-grid">
            
            <!-- Left Column -->
            <div class="left-column">
                
                <!-- Main Orange Card -->
                <div class="orange-card">
                    <div class="header-row">
                        <div class="location"><i class="fas fa-satellite-dish"></i> Eigene Wetterstation</div>
                        <div id="last-update">Letztes Update: --:--</div>
                    </div>
                    <div class="temp-large" id="temp-main">-- °C</div>
                    
                    <div class="location-pills">
                        <div class="pill"><i class="fas fa-microchip"></i> ESP32</div>
                        <div class="pill">BMP085 & DHT11</div>
                    </div>
                </div>

                <!-- Metrics Grid -->
                <div class="metrics-grid">
                    <div class="neu-card metric-card">
                        <i class="fas fa-tint"></i>
                        <div class="metric-title">Luftfeuchtigkeit</div>
                        <div class="metric-value" id="hum-val">-- %</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-tachometer-alt"></i>
                        <div class="metric-title">Luftdruck</div>
                        <div class="metric-value" id="press-val">-- hPa</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="far fa-compass"></i>
                        <div class="metric-title">Windrichtung</div>
                        <div class="metric-value" id="wind-dir-val">--</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-wind"></i>
                        <div class="metric-title">Windgeschw.</div>
                        <div class="metric-value" id="wind-speed-val">-- km/h</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-sun"></i>
                        <div class="metric-title">UV Index</div>
                        <div class="metric-value" id="uv-val">--</div>
                    </div>
                    <div class="neu-card metric-card">
                        <i class="fas fa-cloud-rain"></i>
                        <div class="metric-title">Niederschlag</div>
                        <div class="metric-value" id="rain-val">-- mm</div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="right-column">
                
                <!-- 6 Days History (Gemessene Tagesdurchschnitte) -->
                <div class="days-grid" id="days-history-grid">
                    <!-- Wird per JS befüllt -->
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                    <div class="day-card"><div class="day-name">Lade...</div></div>
                </div>

                <!-- Line Chart (Letzte 24h Temperatur) -->
                <div class="neu-card chart-container">
                    <canvas id="tempChart"></canvas>
                </div>

                <!-- Bottom Row -->
                <div class="bottom-row">
                    <!-- Bar Chart (Letzte 24h Luftfeuchtigkeit) -->
                    <div class="neu-card chart-container">
                        <canvas id="barChart"></canvas>
                    </div>

                    <!-- Right List (Gemessene Höchst- & Tiefstwerte der letzten Tage) -->
                    <div class="neu-card history-list">
                        <div class="history-list-title">
                            <span>Tages-Extreme</span>
                            <i class="fas fa-temperature-half" style="color: var(--text-muted)"></i>
                        </div>
                        <div id="min-max-list">
                            <div class="list-item" style="color: var(--text-muted);">Daten werden berechnet...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ------------------ FIREBASE LOGIC ------------------
        const FIREBASE_LATEST = "https://meteorologia-377e2-default-rtdb.europe-west1.firebasedatabase.app/messwerte.json";
        
        // LIMIT erhöht auf 672. Bei 4 Messungen/h * 24h * 7 Tage = 672 Messungen (Historie der letzten 7 Tage)
        const FIREBASE_HISTORY = "https://meteorologia-377e2-default-rtdb.europe-west1.firebasedatabase.app/historie.json?orderBy=%22timestamp%22&limitToLast=10080";

        // Hilfsfunktion: Windrichtung aus Grad berechnen
        function getWindDirection(deg) {
            const dirs = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
            return dirs[Math.round(deg / 45) % 8];
        }

        // 1. Live Daten laden & in die linke Spalte eintragen
        async function loadLive() {
            try {
                const res = await fetch(FIREBASE_LATEST);
                const data = await res.json();
                if (!data) return;

                document.getElementById('temp-main').innerText = data.temperature.toFixed(2) + " °C";
                document.getElementById('hum-val').innerText = data.humidity.toFixed(0) + " %";
                document.getElementById('press-val').innerText = data.pressure.toFixed(0) + " hPa";
                
                document.getElementById('wind-dir-val').innerText = getWindDirection(data.windDirectionDeg || 0);

                // Platzhalter für noch nicht implementierte Sensoren (ESP32 sendet -1)
                document.getElementById('wind-speed-val').innerText = (data.windSpeed === -1 || data.windSpeed == null) ? "--" : data.windSpeed + " km/h";
                document.getElementById('uv-val').innerText = (data.uvIndex === -1 || data.uvIndex == null) ? "--" : data.uvIndex;
                document.getElementById('rain-val').innerText = (data.rainLast24h === -1 || data.rainLast24h == null) ? "--" : data.rainLast24h + " mm";

                const date = new Date(data.timestamp || Date.now());
                document.getElementById('last-update').innerText = "Update: " + date.toLocaleTimeString("de-DE", {hour: '2-digit', minute:'2-digit'});

            } catch (e) {
                console.error("Fehler beim Laden der Live-Daten:", e);
            }
        }

        // Chart.js Default Settings für Dark Mode
        Chart.defaults.color = '#8b95a5';
        Chart.defaults.borderColor = '#212733';
        let tempChart, barChart;

        // 2. Historie laden, aggregieren und Charts/Listen füllen
        async function loadHistory() {
            try {
                const res = await fetch(FIREBASE_HISTORY);
                const data = await res.json();
                if (!data) return;

                // Array sortieren nach Zeit
                const values = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
                if (values.length === 0) return;
                
                // ---- CHARTS (Letzte 24 Stunden = ca. 96 Messungen) ----
                const last24h = values.slice(-1440); 
                const labels24h = last24h.map(v => new Date(v.timestamp).toLocaleTimeString("de-DE", {hour: '2-digit', minute:'2-digit'}));
                const temps24h = last24h.map(v => v.temperature);
                const hums24h = last24h.map(v => v.humidity);

                // Temperatur Line Chart
                const ctxLine = document.getElementById('tempChart').getContext('2d');
                if(tempChart) tempChart.destroy();
                tempChart = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: labels24h,
                        datasets: [{
                            label: 'Temperatur (°C) - Letzte 24h',
                            data: temps24h,
                            borderColor: '#ff9b26',
                            backgroundColor: 'rgba(255, 155, 38, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: true, position: 'top', align: 'end' } },
                        scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: '#212733' } } }
                    }
                });

                // Luftfeuchtigkeit Bar Chart
                const ctxBar = document.getElementById('barChart').getContext('2d');
                if(barChart) barChart.destroy();
                barChart = new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: labels24h,
                        datasets: [{
                            label: 'Luftfeuchtigkeit (%) - Letzte 24h',
                            data: hums24h,
                            backgroundColor: '#3b82f6',
                            borderRadius: 2
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: true, position: 'top', align: 'end' } },
                        scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: '#212733' }, min: 0, max: 100 } }
                    }
                });

                // ---- STATISTIK DER LETZTEN TAGE (Messwerte gruppieren) ----
                const dailyData = {};
                values.forEach(v => {
                    const d = new Date(v.timestamp);
                    // Erzeugt Format wie "Mo, 08.10."
                    const dayKey = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
                    
                    if (!dailyData[dayKey]) {
                        dailyData[dayKey] = { temps: [], timestamp: v.timestamp };
                    }
                    if (v.temperature != null && !isNaN(v.temperature)) {
                        dailyData[dayKey].temps.push(v.temperature);
                    }
                });

                // In Array umwandeln und sortieren (ältester Tag zuerst)
                const sortedDays = Object.keys(dailyData)
                    .map(key => ({
                        dateLabel: key,
                        temps: dailyData[key].temps,
                        timestamp: dailyData[key].timestamp
                    }))
                    .sort((a, b) => a.timestamp - b.timestamp);

                // Letzte 6 Tage für das obere Grid filtern
                const last6Days = sortedDays.slice(-6);
                
                const gridHtml = last6Days.map(day => {
                    const avgTemp = (day.temps.reduce((a,b) => a+b, 0) / day.temps.length).toFixed(1);
                    return `
                        <div class="day-card">
                            <div class="day-name">${day.dateLabel}</div>
                            <div class="day-temp">Ø ${avgTemp}°</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('days-history-grid').innerHTML = gridHtml;

                // Letzte 4 Tage für die Min/Max Liste filtern (umgekehrte Reihenfolge für Anzeige)
                const last4DaysReversed = [...sortedDays].reverse().slice(0, 4);
                
                const listHtml = last4DaysReversed.map(day => {
                    const maxT = Math.max(...day.temps).toFixed(1);
                    const minT = Math.min(...day.temps).toFixed(1);
                    return `
                        <div class="list-item">
                            <span>${day.dateLabel}</span>
                            <div class="min-max-bar">
                                <span class="min-val">${minT}°</span>
                                <span>—</span>
                                <span class="max-val">${maxT}°</span>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('min-max-list').innerHTML = listHtml;

            } catch (e) {
                console.error("Fehler beim Laden der Verlaufs-Daten:", e);
            }
        }

        // Initiale Aufrufe & Timer
        loadLive();
        loadHistory();
        setInterval(loadLive, 60000);       // Live-Daten jede Minute
        setInterval(loadHistory, 300000);   // Historie alle 5 Minuten
    </script>
</body>
</html>
